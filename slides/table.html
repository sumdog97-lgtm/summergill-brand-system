<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{margin:0}.slide{width:1280px;height:720px;box-sizing:border-box;padding:64px 76px;position:relative;display:flex;flex-direction:column;overflow:hidden;background:var(--color-paper);color:var(--color-ink)}
.dark{background:var(--color-ink);color:#fff}.cobalt{background:var(--color-brand);color:#fff}
.mono{font-family:var(--font-mono)}.eyebrow{font-family:var(--font-mono);font-size:24px;letter-spacing:.2em;text-transform:uppercase;color:var(--color-brand);font-weight:500}
.dark .eyebrow{color:var(--color-brand-soft)}.cobalt .eyebrow{color:rgb(255 255 255 / .75)}
h1,h2,h3{font-family:var(--font-display);font-weight:700;letter-spacing:-.02em;margin:0}
h2{font-size:56px;line-height:1.05;margin-top:16px;margin-bottom:36px}
.footer{position:absolute;bottom:36px;left:76px;right:76px;display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:24px;letter-spacing:.12em;text-transform:uppercase;color:rgb(10 10 10 / .4);border-top:1px solid var(--color-line);padding-top:12px}
.dark .footer,.cobalt .footer{color:rgb(255 255 255 / .55);border-top-color:rgb(255 255 255 / .15)}
.sq{display:inline-block;background:var(--color-brand)}
.card{border:1px solid var(--color-line);padding:24px 28px}.card h3{font-size:30px;margin-bottom:10px}.card p,.card li{font-size:24px;line-height:1.45;color:rgb(10 10 10 / .75)}
ul.check{list-style:none;margin:0;padding:0}ul.check li{padding-left:34px;position:relative;margin-bottom:8px}ul.check li::before{content:'';position:absolute;left:0;top:10px;width:14px;height:14px;border:1.5px solid var(--color-brand)}
.accent{color:var(--color-brand);font-weight:600}
</style></head><body><div class="slide"><div class="eyebrow">Stage 02 / Close</div><h2>Quote, agreement, slot — in one message.</h2><table style="width:100%;border-collapse:collapse;font-size:30px"><tr><th style="font-family:var(--font-mono);font-size:24px;letter-spacing:.12em;text-transform:uppercase;text-align:left;color:rgb(10 10 10 / .5);padding:12px 14px;border-bottom:1px solid var(--color-ink);font-weight:500">Tier</th><th style="font-family:var(--font-mono);font-size:24px;letter-spacing:.12em;text-transform:uppercase;text-align:left;color:rgb(10 10 10 / .5);padding:12px 14px;border-bottom:1px solid var(--color-ink);font-weight:500">Build</th><th style="font-family:var(--font-mono);font-size:24px;letter-spacing:.12em;text-transform:uppercase;text-align:left;color:rgb(10 10 10 / .5);padding:12px 14px;border-bottom:1px solid var(--color-ink);font-weight:500">Monthly</th><th style="font-family:var(--font-mono);font-size:24px;letter-spacing:.12em;text-transform:uppercase;text-align:left;color:rgb(10 10 10 / .5);padding:12px 14px;border-bottom:1px solid var(--color-ink);font-weight:500">Annual</th></tr><tr><td style="padding:18px 14px;border-bottom:1px solid var(--color-line);">Promo (5 slots)</td><td style="padding:18px 14px;border-bottom:1px solid var(--color-line);font-family:var(--font-mono)">£495</td><td style="padding:18px 14px;border-bottom:1px solid var(--color-line);font-family:var(--font-mono)">£29/mo</td><td style="padding:18px 14px;border-bottom:1px solid var(--color-line);font-family:var(--font-mono)">£290/yr</td></tr><tr><td style="padding:18px 14px;border-bottom:1px solid var(--color-line);">Standard</td><td style="padding:18px 14px;border-bottom:1px solid var(--color-line);font-family:var(--font-mono)">£850</td><td style="padding:18px 14px;border-bottom:1px solid var(--color-line);font-family:var(--font-mono)">£39/mo</td><td style="padding:18px 14px;border-bottom:1px solid var(--color-line);font-family:var(--font-mono)">£390/yr</td></tr></table><div class="mono" style="margin-top:28px;font-size:24px;letter-spacing:.06em;text-transform:uppercase;color:rgb(10 10 10 / .5);max-width:1000px">Say the standard price out loud so the discount is real.</div><div class="footer"><span>Sale → Onboarding SOP</span><span>04</span></div></div></body></html>
