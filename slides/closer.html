<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{margin:0}.slide{width:1280px;height:720px;box-sizing:border-box;padding:64px 76px;position:relative;display:flex;flex-direction:column;overflow:hidden;background:var(--color-paper);color:var(--color-ink)}
.dark{background:var(--color-ink);color:#fff}.cobalt{background:var(--color-brand);color:#fff}
.mono{font-family:var(--font-mono)}.eyebrow{font-family:var(--font-mono);font-size:24px;letter-spacing:.2em;text-transform:uppercase;color:var(--color-brand);font-weight:500}
.dark .eyebrow{color:var(--color-brand-soft)}.cobalt .eyebrow{color:rgb(255 255 255 / .75)}
h1,h2,h3{font-family:var(--font-display);font-weight:700;letter-spacing:-.02em;margin:0}
h2{font-size:56px;line-height:1.05;margin-top:16px;margin-bottom:36px}
.footer{position:absolute;bottom:36px;left:76px;right:76px;display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:24px;letter-spacing:.12em;text-transform:uppercase;color:rgb(10 10 10 / .4);border-top:1px solid var(--color-line);padding-top:12px}
.dark .footer,.cobalt .footer{color:rgb(255 255 255 / .55);border-top-color:rgb(255 255 255 / .15)}
.sq{display:inline-block;background:var(--color-brand)}
.card{border:1px solid var(--color-line);padding:24px 28px}.card h3{font-size:30px;margin-bottom:10px}.card p,.card li{font-size:24px;line-height:1.45;color:rgb(10 10 10 / .75)}
ul.check{list-style:none;margin:0;padding:0}ul.check li{padding-left:34px;position:relative;margin-bottom:8px}ul.check li::before{content:'';position:absolute;left:0;top:10px;width:14px;height:14px;border:1.5px solid var(--color-brand)}
.accent{color:var(--color-brand);font-weight:600}
</style></head><body><div class="slide cobalt"><div class="eyebrow">Remember</div><div style="margin:auto 0"><h1 style="font-size:84px;line-height:1.02">The product is the website.<br>The business is the relationship.</h1><p style="margin-top:32px;font-size:32px;line-height:1.5;color:rgb(255 255 255 / .85);max-width:960px">Builds earn once. Care earns forever. Every promise kept is a referral.</p></div><img src="../assets/logo/summergill-horizontal-white.png" alt="Summergill" style="display:block;height:56px;margin-bottom:60px"><div class="footer"><span>Internal only · V1.0 · June 2026</span><span>12</span></div></div></body></html>
