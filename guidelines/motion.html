<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:24px;background:#fff;font-family:var(--font-body);color:var(--color-ink)}.mono{font-family:var(--font-mono);font-size:11px;letter-spacing:.025em;text-transform:uppercase;color:var(--ink-55)}@keyframes up{0%,20%{opacity:0;transform:translateY(22px)}60%,100%{opacity:1;transform:none}}.r{animation:up 2.4s ease infinite}</style></head><body><div style="display:flex;gap:16px"><div class="r" style="animation-delay:0s;flex:1;background:var(--color-surface);padding:20px;border:1px solid var(--ink-15)"><div style="font-family:var(--font-display);font-weight:700">.reveal</div><div class="mono" style="margin-top:6px">opacity 0→1 · y 22→0</div></div><div class="r" style="animation-delay:0.15s;flex:1;background:var(--color-surface);padding:20px;border:1px solid var(--ink-15)"><div style="font-family:var(--font-display);font-weight:700">.reveal</div><div class="mono" style="margin-top:6px">opacity 0→1 · y 22→0</div></div><div class="r" style="animation-delay:0.3s;flex:1;background:var(--color-surface);padding:20px;border:1px solid var(--ink-15)"><div style="font-family:var(--font-display);font-weight:700">.reveal</div><div class="mono" style="margin-top:6px">opacity 0→1 · y 22→0</div></div></div><div class="mono" style="margin-top:14px">Disabled under prefers-reduced-motion · no bounces, no springs</div></body></html>
